publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
overrides:
  normalize-package-data: ^9.0.0
allowBuilds:
  esbuild: true
  oxc-resolver: true
  unrs-resolver: true
  rollup: false
  '@github/keytar': true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1137.0'
  - brewpub@0.2.0
  - yargs@18.2.0
